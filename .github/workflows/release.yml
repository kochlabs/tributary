# Publishes a release when a version tag is pushed (v1.2.3, or v1.2.3-rc.1
# for a pre-release): runs the checks, builds the .deb, and attaches it with
# install.sh and SHA256SUMS to a GitHub release, with build provenance
# attestations (verify with: gh attestation verify <file> --repo kochlabs/tributary).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write     # create the release
      id-token: write     # sign the attestations
      attestations: write
    steps:
      - name: Check the tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::tag $TAG is not v<major>.<minor>.<patch>[-<pre-release>]"; exit 1
          fi
          version=${TAG#v}
          # Debian sorts "~" before everything, so 1.2.0~rc.1 < 1.2.0.
          echo "deb=${version/-/\~}" >> "$GITHUB_OUTPUT"
          [[ $version == *-* ]] && echo "prerelease=--prerelease" >> "$GITHUB_OUTPUT" || true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the package changelog comes from the history
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # don't let a cache shared with other runs into a release build
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
      - run: make check
      - name: Build the package
        env:
          VERSION: ${{ steps.version.outputs.deb }}
        run: make deb VERSION="$VERSION"
      - name: Collect the release files
        env:
          VERSION: ${{ steps.version.outputs.deb }}
        run: |
          mkdir release
          cp "dist/tributary_${VERSION}_amd64.deb" release/
          install -m 755 deploy/install.sh release/install.sh
          cd release && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          # shellcheck disable=SC2086 # PRERELEASE is empty or one flag
          gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Tributary ${TAG#v}" --generate-notes $PRERELEASE
